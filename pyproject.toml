[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "psilogic"
dynamic = ["version"]
authors = [
  { name = "Ali (Troxter222)", email = "troxtergrif@gmail.com" },
]
description = "PsiLogic: Active Cancellation Optimizer for Deep Neural Networks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["optimizer", "deep learning", "pytorch", "machine learning", "neural networks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "torchvision>=0.10",
]
integrations = [
    "transformers>=4.30",
    "accelerate>=0.20",
    "safetensors>=0.3",
    "tokenizers>=0.13",
    "lightning>=2.0",
]
benchmark = [
    "numpy>=1.20",
    "torchvision>=0.10",
    "transformers>=4.30",
    "datasets>=2.0",
]
all = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "torchvision>=0.10",
    "transformers>=4.30",
    "lightning>=2.0",
    "datasets>=2.0",
    "numpy>=1.20",
]

[tool.setuptools.dynamic]
version = {attr = "psilogic._version.__version__"}

[tool.setuptools.package-data]
psilogic = ["py.typed"]

[project.urls]
"Homepage"    = "https://github.com/Troxter222/psilogic"
"Paper"       = "https://doi.org/10.5281/zenodo.18739857"
"Bug Tracker" = "https://github.com/Troxter222/psilogic/issues"
"Source"      = "https://github.com/Troxter222/psilogic"

[tool.setuptools.packages.find]
where = ["."]
include = ["psilogic*"]
exclude = ["tests*", "benchmark*", "dist*", "*.egg-info*"]

[tool.pytest.ini_options]
testpaths   = ["tests"]
addopts     = "-ra -q --tb=short"
markers = [
    "gpu: requires a CUDA device",
    "multi_gpu: requires two or more CUDA devices",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length    = 100
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function call in default arguments
    "UP045", # X | None requires Python 3.10+
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811", "B007", "B011"]
"benchmark/*" = ["E702", "B007", "F401", "C408", "E402"]
"examples/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version         = "3.10"
warn_return_any        = true
warn_unused_configs    = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "psilogic.integrations.*"
disable_error_code = ["override", "assignment", "dict-item", "arg-type"]
