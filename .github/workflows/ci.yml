name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Py${{ matrix.python-version }} / torch ${{ matrix.torch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Current stable CPU torch across actively supported Pythons.
          - python-version: "3.10"
            torch: "latest"
          - python-version: "3.11"
            torch: "latest"
          - python-version: "3.12"
            torch: "latest"
          # Older supported PyTorch pin (backend / integration regressions).
          - python-version: "3.11"
            torch: "2.2.2"
          # Older Python still listed in package classifiers, pinned torch.
          - python-version: "3.9"
            torch: "2.2.2"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          TORCH_INDEX="https://download.pytorch.org/whl/cpu"
          if [ "${{ matrix.torch }}" = "latest" ]; then
            pip install torch torchvision --index-url "$TORCH_INDEX"
          else
            # torchvision pin tracks the chosen torch minor from the CPU index.
            case "${{ matrix.torch }}" in
              2.2.2) TV="0.17.2" ;;
              *) echo "Add a torchvision pin for torch ${{ matrix.torch }}"; exit 1 ;;
            esac
            pip install "torch==${{ matrix.torch }}" "torchvision==${TV}" --index-url "$TORCH_INDEX"
          fi
          pip install -e ".[dev,hf]" --extra-index-url "$TORCH_INDEX"

      - name: Lint
        run: ruff check psilogic tests benchmark examples

      - name: Run tests
        run: pytest tests/ -v --tb=short

  cross-platform:
    name: Cross-platform / Py3.11
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          pip install --upgrade pip
          TORCH_INDEX="https://download.pytorch.org/whl/cpu"
          pip install torch torchvision --index-url "$TORCH_INDEX"
          pip install -e ".[dev,hf]" --extra-index-url "$TORCH_INDEX"

      - name: Lint
        run: ruff check psilogic tests benchmark examples

      - name: Run tests
        run: pytest tests/ -v --tb=short

  format-check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff format --check psilogic tests benchmark examples

  typecheck:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Type check
        run: mypy psilogic

  package:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          pip install --upgrade pip build
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build sdist and wheel
        run: python -m build

      - name: Install wheel and smoke-import
        run: |
          pip install dist/psilogic-*.whl
          python - <<'EOF'
          import psilogic
          import torch
          import torch.nn as nn

          print("psilogic", psilogic.__version__)
          model = nn.Linear(4, 2)
          opt = psilogic.PsiLogic(model.parameters(), lr=1e-3)
          x = torch.randn(2, 4)
          loss = nn.MSELoss()(model(x), torch.randn(2, 2))
          loss.backward()
          opt.step()
          print("wheel smoke OK")
          EOF
