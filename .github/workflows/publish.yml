name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  id-token: write
  contents: write   # needed for GitHub Release creation

jobs:
  # ── 1. Verify CI passes on the tagged commit ─────────────────────────────
  verify-ci:
    name: Verify CI Status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package (CPU-only torch for smoke test)
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Run tests (CPU-safe; GPU tests auto-skipped)
        run: |
          pytest tests/ -v --tb=short

  # ── 2. Build wheel + sdist ───────────────────────────────────────────────
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    needs: verify-ci
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install --upgrade pip build

      - name: Build distributions
        run: python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── 3. Publish to TestPyPI ───────────────────────────────────────────────
  publish-testpypi:
    name: Publish → TestPyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: testpypi
      url: https://test.pypi.org/p/psilogic
    permissions:
      id-token: write   # required for trusted publishing (OIDC)
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # ── 4. Smoke-test the TestPyPI install ───────────────────────────────────
  smoke-test:
    name: Smoke-test TestPyPI Install
    runs-on: ubuntu-latest
    needs: publish-testpypi
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install from TestPyPI
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Retry a few times — TestPyPI propagation can take ~30 s
          for i in 1 2 3 4 5; do
            pip install --index-url https://test.pypi.org/simple/ \
                        --extra-index-url https://pypi.org/simple/ \
                        psilogic && break
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done

      - name: Verify import and version
        run: |
          python - <<'EOF'
          import psilogic, torch, torch.nn as nn
          print(f"psilogic version: {psilogic.__version__}")
          model = nn.Linear(4, 2)
          opt   = psilogic.PsiLogic(model.parameters(), lr=1e-3)
          x = torch.randn(2, 4)
          loss = nn.MSELoss()(model(x), torch.randn(2, 2))
          loss.backward()
          opt.step()
          print("Smoke test passed ✓")
          EOF

  # ── 5. Publish to PyPI (production) ─────────────────────────────────────
  publish-pypi:
    name: Publish → PyPI
    runs-on: ubuntu-latest
    needs: smoke-test
    environment:
      name: pypi
      url: https://pypi.org/p/psilogic
    permissions:
      id-token: write   # required for trusted publishing (OIDC)
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ── 6. Create GitHub Release ─────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish-pypi
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
